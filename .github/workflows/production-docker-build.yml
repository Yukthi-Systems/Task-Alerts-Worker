name: Docker Image CI - Production

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: Het-8v-16G
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

  docker:
    needs: test
    runs-on: Het-8v-16G
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Determine Docker tag
        id: tag
        run: echo "TAG=$(echo $GITHUB_REF | cut -d'/' -f3)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Pull requests only build; main and tags push, so :latest is always merged code.
          push: ${{ github.event_name != 'pull_request' }}
          sbom: true
          provenance: true
          tags: |
            rjyspl/tasks-alerts-rmq-worker:latest
            rjyspl/tasks-alerts-rmq-worker:${{ steps.tag.outputs.TAG }}
